name: ESP32 Compile Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      board:
        description: 'ESP32 board (example: esp32h2)'
        required: true
        default: 'esp32h2'

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BOARD: ${{ github.event.inputs.board || 'esp32h2' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.4.0"

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install required libraries
        working-directory: Code/esp32_racebox_mini_emulator
        run: |
          arduino-cli lib update-index
      
          while IFS= read -r line || [ -n "$line" ]; do
            # Remove leading/trailing spaces
            line="$(echo "$line" | xargs)"
            # Skip empty lines and comments
            if [[ -z "$line" ]] || [[ "$line" =~ ^# ]]; then
              continue
            fi
      
            echo "Installing library: $line"
            arduino-cli lib install "$line"
          done < libraries.txt

      - name: Compile sketch
        working-directory: Code/esp32_racebox_mini_emulator
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:${BOARD} \
            --build-path build \
            esp32_racebox_mini_emulator.ino

